name: Release 0.2.2 local brand images
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-0.2.2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_and_release:
    if: github.repository == 'cuichaobaobao/reachy_mini_homeassistant' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PNGs and unchanged runtime dependencies
        run: |
          python3 - <<'PY'
          import hashlib, json, struct, subprocess, zlib
          from pathlib import Path
          root = Path("custom_components/reachy_mini")
          old = json.loads(subprocess.check_output(["git", "show", "v0.2.1:" + str(root / "manifest.json")]))
          current = json.loads((root / "manifest.json").read_text())
          assert current.pop("version") == "0.2.2"
          old.pop("version")
          assert current == old, "Only manifest version may change"
          changed = subprocess.check_output(["git", "diff", "--name-only", "v0.2.1", "HEAD", "--", "custom_components", "wheels", "hacs.json"]).decode().splitlines()
          assert all(p.startswith(str(root / "brand") + "/") or p == str(root / "manifest.json") for p in changed), changed
          for name, size, sha in [
              ("icon.png", 256, "e8e52eb9c11ae75359dc001c1e898fe255f7012b"),
              ("logo.png", 256, "e8e52eb9c11ae75359dc001c1e898fe255f7012b"),
              ("icon@2x.png", 512, "b563dd5929f4a5b788d9f91b974a87874f985343"),
              ("logo@2x.png", 512, "b563dd5929f4a5b788d9f91b974a87874f985343"),
          ]:
              data = (root / "brand" / name).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              assert struct.unpack(">II", data[16:24]) == (size, size)
              assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == sha
              offset = 8
              chunks = []
              while offset < len(data):
                  length = struct.unpack(">I", data[offset:offset+4])[0]
                  kind = data[offset+4:offset+8]
                  payload = data[offset+8:offset+8+length]
                  crc = struct.unpack(">I", data[offset+8+length:offset+12+length])[0]
                  assert zlib.crc32(kind + payload) & 0xffffffff == crc
                  chunks.append(kind)
                  offset += 12 + length
              assert chunks[-1] == b"IEND" and offset == len(data)
              print("PASS", name, size, "PNG integrity and upstream asset identity")
          print("PASS: runtime code and dependency requirements unchanged from 0.2.1")
          PY
      - name: Publish 0.2.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.2.2 --target "$GITHUB_SHA" --title "0.2.2 — Local Reachy Mini icon" --notes-file RELEASE_0.2.2.md
