name: Release camera resource fix
on:
  push:
    paths: ['.github/workflows/release-0.2.3.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'cuichaobaobao/reachy_mini_homeassistant' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7bb48c6aa24a1854ba8f4662e55e7b54f4c9d341
          fetch-depth: 0
      - name: Verify exact commit passed cloud checks and dependencies are unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/cuichaobaobao/reachy_mini_homeassistant/actions/runs/38906001379 > /tmp/run.json
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          run = json.loads(Path("/tmp/run.json").read_text())
          assert run["head_sha"] == "7bb48c6aa24a1854ba8f4662e55e7b54f4c9d341"
          assert run["conclusion"] == "success"
          manifest_path = "custom_components/reachy_mini/manifest.json"
          old = json.loads(subprocess.check_output(["git", "show", "v0.2.2:" + manifest_path]))
          new = json.loads(Path(manifest_path).read_text())
          assert new.pop("version") == "0.2.3"
          old.pop("version")
          assert new == old, "unexpected manifest or dependency change"
          changed = subprocess.check_output(["git", "diff", "--name-only", "v0.2.2", "HEAD"]).decode().splitlines()
          allowed = {"custom_components/reachy_mini/stream.py", manifest_path, ".github/workflows/av19-compatibility.yml", "scripts/check_camera_resources.py", "RELEASE_0.2.3.md"}
          assert set(changed) == allowed, changed
          PY
      - name: Publish tested version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.2.3 --target "7bb48c6aa24a1854ba8f4662e55e7b54f4c9d341" --title "0.2.3 — camera resource management" --notes-file RELEASE_0.2.3.md
