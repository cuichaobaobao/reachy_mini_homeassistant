name: Sync release notes
on:
  push:
    branches: [main]
    paths:
      - 'RELEASE_*.md'
      - '.github/workflows/release-notes.yml'
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'cuichaobaobao/reachy_mini_homeassistant'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Update existing release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/reachy_mini/manifest.json"))["version"])')
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release edit "v$version" --notes-file "RELEASE_$version.md"
          else
            echo "Release does not exist yet; its publishing workflow will use the notes."
          fi
