name: Robot controls and release
on:
  push:
    branches: [main, fix/0.2.9-controls]
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - '.github/workflows/app-controls.yml'
      - 'RELEASE_0.2.9.md'
      - 'MANUAL_CONTROLS.md'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test environment with unchanged integration dependencies
        run: |
          python -m pip install "homeassistant==2026.10.1" pytest-homeassistant-custom-component "av==19.0.0" "PyTurboJPEG==1.8.3" wheels/aiortc-1.14.0+av19.1-py3-none-any.whl
          python -m pip check
      - name: Verify scope and imports
        run: |
          python - <<'PY'
          import importlib, json, subprocess
          from pathlib import Path
          path = "custom_components/reachy_mini/manifest.json"
          new = json.loads(Path(path).read_text())
          assert new.pop("version") == "0.2.9"
          previous = json.loads(subprocess.check_output(["git", "show", "v0.2.8:" + path]))
          previous.pop("version")
          assert new == previous, "Manifest changed beyond version"
          protected = ["wheels", "custom_components/reachy_mini/stream.py", "custom_components/reachy_mini/camera.py", "custom_components/reachy_mini/app_control.py", "custom_components/reachy_mini/brand", "custom_components/reachy_mini/services.py"]
          assert not subprocess.check_output(["git", "diff", "v0.2.8", "HEAD", "--", *protected])
          for name in ("", ".button", ".select", ".coordinator", ".app_control", ".camera", ".config_flow", ".number", ".switch", ".manual_control"):
              importlib.import_module("custom_components.reachy_mini" + name)
          assert json.loads(Path("custom_components/reachy_mini/strings.json").read_text()) == json.loads(Path("custom_components/reachy_mini/translations/en.json").read_text())
          PY
      - name: Control gating, manual control and existing lifecycle tests
        run: python -m pytest -q tests/test_controls.py tests/test_manual_control.py tests/test_app_control.py tests/test_wake_sleep.py tests/test_app_slot.py
      - name: Existing camera resource regression
        run: python scripts/check_camera_resources.py
      - name: Existing media compatibility regression
        run: python scripts/check_av19_media.py

  publish:
    needs: checks
    if: github.repository == 'cuichaobaobao/reachy_mini_homeassistant' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify unchanged dependencies and media code
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          path = "custom_components/reachy_mini/manifest.json"
          old = json.loads(subprocess.check_output(["git", "show", "v0.2.8:" + path]))
          new = json.loads(Path(path).read_text())
          assert new.pop("version") == "0.2.9"
          old.pop("version")
          assert old == new
          assert not subprocess.check_output(["git", "diff", "v0.2.8", "HEAD", "--", "wheels", "custom_components/reachy_mini/stream.py", "custom_components/reachy_mini/camera.py", "custom_components/reachy_mini/app_control.py", "custom_components/reachy_mini/brand"])
          PY
      - name: Publish tested version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.9 >/dev/null 2>&1; then
            echo "Release v0.2.9 already exists; leaving it unchanged."
          else
            gh release create v0.2.9 --target "$GITHUB_SHA" --title "0.2.9 — manual controls aligned with the desktop" --notes-file RELEASE_0.2.9.md
          fi
